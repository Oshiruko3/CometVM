; ポケコン復活プロジェクト - Cardputer用ファームウェア
; COMET VM（CASL2）をM5Stack Cardputer（ESP32-S3・ADV版）で動かす
;
; フェーズ1-第2段階 ①: COMET VMのCardputer移植
; 段階1: シリアル経由で「Hello, COMET」（コアの動作確認）※完了
; 段階2: UI層（TFT・キーボード）でG850の操作感
;
; ※Cardputerのボード定義がPlatformIOに無いため、同じM5StampS3モジュール搭載の
;   m5stack-stamps3をベースに、ADV版（16MB Flash）を上書きする
;
; ※M5Unified/M5Cardputer/M5GFX は使わない（初期化でフリーズするため・8/12調査）。
;   TFT(ST7789)は LovyanGFX で直接駆動、キーボード(TCA8418)は Wire で直接駆動する。
;   Cardputerのピン配線: TFT MOSI=35/SCLK=36/DC=34/CS=37/RST=33/BL=38、
;   TCA8418 SDA=8/SCL=9/INT=11（M5GFXの自動検出コードより）

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB

lib_deps =
    lovyan03/LovyanGFX

extra_scripts = post:rename_bin.py

build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
